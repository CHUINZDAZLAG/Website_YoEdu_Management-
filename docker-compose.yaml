services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: day_1_db
    volumes:
      - day_1_data:/var/lib/mysql
    networks:
      - day_1_network

volumes:
  day_1_data:

networks:
  day_1_network:
    name: day_1_network
    driver: bridge