spring:
  application:
    name: project_demo
  profiles:
    active: ${APP_PROFILE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # Select database driver (MySQL || Postgresql)
    # Connection string jdbc:{mysql}
    url: ${YOEDU_DB_URL:jdbc:mysql://localhost:3306/yoedu_demo?createDatabaseIfNotExist=true}
    username: ${YOEDU_DB_USERNAME:root}
    password: ${YOEDU_DB_PASSWORD:dev}
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

  server:
    port: 8080